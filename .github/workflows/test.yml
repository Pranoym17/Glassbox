name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - name: Test visualizer logic
        run: deno test --allow-read visualizer/app_test.js
      - name: Check formatting
        run: cargo fmt --check
      - name: Test CPU and autograd paths
        run: cargo test --features cpu-only
      - name: Lint
        run: cargo clippy --all-targets --features cpu-only -- -D warnings
      - name: Test Python bindings
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip maturin
          maturin develop --features extension-module,cpu-only
          python python/tests/test_smoke.py
