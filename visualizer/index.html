<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glassbox Event Stream</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    body { margin: 0; background: #101418; color: #d8e1e8; }
    main { max-width: 880px; margin: 10vh auto; padding: 2rem; }
    h1 { font-size: 1.35rem; font-weight: 600; }
    .status { display: flex; gap: 2rem; padding: 1rem; border: 1px solid #34414a; border-radius: .5rem; background: #171d22; }
    .value { color: #7dd3fc; }
    p { color: #94a3b8; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Glassbox Event Stream</h1>
    <div class="status">
      <span>connection <strong class="value" id="connection">connecting</strong></span>
      <span>step <strong class="value" id="step">-</strong></span>
      <span>events <strong class="value" id="count">0</strong></span>
    </div>
    <p>The Week 6 transport is live. Events are logged to the browser console; graph rendering is added in Week 7.</p>
  </main>
  <script>
    const connection = document.querySelector("#connection");
    const count = document.querySelector("#count");
    const step = document.querySelector("#step");
    let seen = 0;
    const source = new EventSource("/events");
    source.onopen = () => connection.textContent = "live";
    source.onerror = () => connection.textContent = "reconnecting";
    source.onmessage = message => {
      const event = JSON.parse(message.data);
      count.textContent = ++seen;
      step.textContent = event.step;
      console.log(event);
    };
  </script>
</body>
</html>
